name: Temporary semantic Mahjong paipu
on:
  push:
    branches: [refactor/mahjong-semantic-paipu]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/patch-semantic-paipu.py
      - run: python .github/scripts/patch-semantic-paipu-fixes.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Persist checked refactor
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Siyu Long"
          git config user.email "i@longern.com"
          git add games/mahjong tests/mahjong-paipu.test.js tests/mahjong-paipu-replay-coordinates.test.js tests/mahjong-room-paipu-integration.test.js tests/mahjong-semantic-paipu.test.js
          git commit -m "Refactor Mahjong paipu to semantic actions"
          git push origin HEAD:refactor/mahjong-semantic-paipu
