name: Temporary centralize paipu claim recording
on:
  push:
    branches: [refactor/mahjong-deterministic-paipu-replay]
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch, test, and push
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Centralize deterministic paipu claim recording" ]; then
            exit 0
          fi
          git checkout origin/main -- src/local-lua-game.js games/mahjong/room-paipu-online-source.js
          python - <<'PY'
          from pathlib import Path

          path = Path("games/mahjong/game.lua")
          text = path.read_text()
          old = 'local function paipu_command(state, action)\n\tlocal command = copy_record_value(action)\n\tif type(command.tileId) == "number" then\n\t\tcommand.tile = paipu_tile_reference(state, command.tileId)\n\t\tcommand.tileId = nil\n\tend\n\treturn command\nend'
          new = 'local function paipu_command(state, action, actor_id)\n\tlocal command = copy_record_value(action)\n\tif command.type == "claim" then\n\t\tlocal selected_index = math.floor(tonumber(command.option) or 0)\n\t\tfor _, claimant in ipairs(state.claimants or {}) do\n\t\t\tif claimant.playerId == actor_id then\n\t\t\t\tlocal option = claimant.options and claimant.options[selected_index]\n\t\t\t\tif option then\n\t\t\t\t\tcommand.kind = option.kind\n\t\t\t\t\tcommand.tiles = {}\n\t\t\t\t\tfor _, tile in ipairs(option.tileIds or {}) do\n\t\t\t\t\t\tcommand.tiles[#command.tiles + 1] = paipu_tile_reference(state, tile)\n\t\t\t\t\tend\n\t\t\t\tend\n\t\t\t\tbreak\n\t\t\tend\n\t\tend\n\tend\n\tif type(command.tileId) == "number" then\n\t\tcommand.tile = paipu_tile_reference(state, command.tileId)\n\t\tcommand.tileId = nil\n\tend\n\treturn command\nend'
          assert old in text
          text = text.replace(old, new, 1)
          old_call = '\t\taction = paipu_command(state, action),'
          assert old_call in text
          path.write_text(text.replace(old_call, '\t\taction = paipu_command(state, action, actor_id),', 1))

          path = Path("games/mahjong/app/replay-controller.js")
          text = path.read_text()
          old = 'if (entry.action?.type !== "claim" || !entry.action.paipuClaim) return entry;'
          assert old in text
          path.write_text(text.replace(old, 'if (entry.action?.type !== "claim" || !Array.isArray(entry.action.replayClaimTileIds)) return entry;', 1))

          path = Path("tests/mahjong-paipu-replay-coordinates.test.js")
          text = path.read_text()
          old = '      paipuClaim: {\n        kind: "pon",\n        tiles: [{ ref: 12 }, { ref: 44 }],\n      },'
          assert old in text
          text = text.replace(old, '      kind: "pon",\n      tiles: [{ ref: 12 }, { ref: 44 }],', 1)
          text = text.replace('assert.equal(resolved.paipuClaim, undefined);', 'assert.equal(resolved.replayClaimTileIds, undefined);', 1)
          path.write_text(text)
          PY
          npm ci
          npm test
          npm run build
          git config user.name "Siyu Long"
          git config user.email "i@longern.com"
          git add games/mahjong/game.lua games/mahjong/app/replay-controller.js games/mahjong/room-paipu-online-source.js src/local-lua-game.js tests/mahjong-paipu-replay-coordinates.test.js
          git commit -m "Centralize deterministic paipu claim recording"
          git push origin HEAD:refactor/mahjong-deterministic-paipu-replay
