<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f1" />
    <title>斗地主 | Playweft</title>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <header class="game-header">
      <div class="game-brand">
        <img src="/dou-dizhu.svg" alt="" />
        <div>
          <h1>斗地主</h1>
          <p>三人叫分，先出完手牌获胜</p>
        </div>
      </div>
      <div id="connection" class="connection-status" data-mode="waiting">
        <span>连接平台中</span>
      </div>
    </header>

    <main class="landlord-layout">
      <section class="round-bar" aria-live="polite">
        <div>
          <p id="turn-kicker">等待房主开始</p>
          <h2 id="turn-heading">牌桌已就绪</h2>
        </div>
        <div class="round-meta">
          <span>倍数 <strong id="multiplier">1</strong></span>
          <span>底牌 <strong id="bottom-count">3</strong></span>
        </div>
      </section>

      <section class="players-strip" aria-label="对局玩家">
        <article id="player-one" class="table-player player-one">
          <div class="player-topline"><span class="seat-marker"></span><span data-player-name>玩家 1</span></div>
          <div class="player-detail"><span data-role>农民</span><strong data-hand-count>17 张</strong></div>
        </article>
        <article id="player-two" class="table-player player-two">
          <div class="player-topline"><span class="seat-marker"></span><span data-player-name>玩家 2</span></div>
          <div class="player-detail"><span data-role>农民</span><strong data-hand-count>17 张</strong></div>
        </article>
        <article id="player-three" class="table-player player-three">
          <div class="player-topline"><span class="seat-marker"></span><span data-player-name>玩家 3</span></div>
          <div class="player-detail"><span data-role>农民</span><strong data-hand-count>17 张</strong></div>
        </article>
      </section>

      <section class="table-stage" aria-labelledby="turn-heading">
        <div class="table-felt">
          <div class="bottom-cards" aria-label="三张底牌"><span></span><span></span><span></span></div>
          <p id="table-message" class="table-message">进入 Playweft 房间后开始对局</p>
          <div id="last-play" class="last-play" aria-label="桌面上的牌"></div>
        </div>
      </section>

      <section class="action-zone" aria-label="出牌操作">
        <div id="bid-actions" class="bid-actions" hidden>
          <button type="button" data-bid="0" class="pass-action">不叫</button>
          <button type="button" data-bid="1">叫 1 分</button>
          <button type="button" data-bid="2">叫 2 分</button>
          <button type="button" data-bid="3" class="strong-bid">叫 3 分</button>
        </div>
        <div id="play-actions" class="play-actions" hidden>
          <button id="pass-button" type="button" class="pass-action"><span class="icon-button-content"><i data-lucide="circle-off"></i>不出</span></button>
          <button id="play-button" type="button" class="play-action"><span class="icon-button-content"><i data-lucide="send"></i>出牌</span></button>
        </div>
        <button id="rematch-button" class="rematch-action" type="button" hidden><span class="icon-button-content"><i data-lucide="rotate-ccw"></i>再来一局</span></button>
      </section>

      <section class="hand-zone" aria-label="你的手牌">
        <div class="hand-heading"><span>你的手牌</span><span id="selection-count">已选 0 张</span></div>
        <div id="hand" class="hand"></div>
      </section>
    </main>
  </body>
</html>
