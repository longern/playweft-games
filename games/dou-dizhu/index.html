<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#126b4b" />
    <title>斗地主 | Playweft</title>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="landlord-layout">
      <section class="round-copy" aria-live="polite">
        <p id="turn-kicker">等待房主开始</p>
        <h1 id="turn-heading">牌桌已就绪</h1>
      </section>

      <header class="top-bar">
        <article id="player-left" class="table-player seat-left" data-position="left">
          <div class="player-profile">
            <span class="seat-marker" aria-hidden="true"><img data-player-avatar alt="" hidden /></span>
            <div class="player-copy"><strong data-player-name>玩家 2</strong><span data-role></span></div>
          </div>
          <div class="opponent-hand" aria-label="剩余 17 张牌"><span class="mini-card-stack" aria-hidden="true"><i></i><i></i><i></i></span><strong data-hand-count aria-hidden="true">17</strong></div>
          <span class="bid-status" data-bid-status role="status" hidden></span>
        </article>

        <section class="table-info" aria-live="polite">
          <div class="table-meta">倍数 ×<strong id="multiplier">1</strong></div>
          <p id="table-message" class="table-message">进入 Playweft 房间后开始对局</p>
        </section>

        <article id="player-right" class="table-player seat-right" data-position="right">
          <div class="player-profile">
            <span class="seat-marker" aria-hidden="true"><img data-player-avatar alt="" hidden /></span>
            <div class="player-copy"><strong data-player-name>玩家 3</strong><span data-role></span></div>
          </div>
          <div class="opponent-hand" aria-label="剩余 17 张牌"><span class="mini-card-stack" aria-hidden="true"><i></i><i></i><i></i></span><strong data-hand-count aria-hidden="true">17</strong></div>
          <span class="bid-status" data-bid-status role="status" hidden></span>
        </article>
      </header>

      <section class="table-stage" aria-labelledby="turn-heading">
        <div id="bottom-cards" class="bottom-cards" aria-label="三张底牌"></div>
        <div id="table-plays" class="table-plays" aria-label="桌面上的牌"></div>
        <div id="pass-markers" class="pass-markers" aria-label="本轮不出记录"></div>
      </section>

      <section class="lower-area">
        <article id="player-self" class="table-player" data-position="self">
          <div class="player-profile">
            <span class="seat-marker" aria-hidden="true"><img data-player-avatar alt="" hidden /></span>
            <div class="player-copy"><strong data-player-name>玩家 1</strong><span data-role></span></div>
          </div>
          <div class="opponent-hand" aria-label="剩余 17 张牌"><span class="mini-card-stack" aria-hidden="true"><i></i><i></i><i></i></span><strong data-hand-count aria-hidden="true">17</strong></div>
          <span class="bid-status" data-bid-status role="status" hidden></span>
        </article>

        <section class="action-zone" aria-label="出牌操作">
          <div id="bid-actions" class="bid-actions" hidden>
            <button type="button" data-bid="0" class="pass-action">不叫</button>
            <button type="button" data-bid="1">叫 1 分</button>
            <button type="button" data-bid="2">叫 2 分</button>
            <button type="button" data-bid="3" class="strong-bid">叫 3 分</button>
          </div>
          <div id="play-actions" class="play-actions" hidden>
            <p id="play-hint" class="play-hint" role="status" hidden></p>
            <button id="pass-button" type="button" class="pass-action"><span class="icon-button-content"><i data-lucide="circle-off"></i>不出</span></button>
            <button id="hint-button" type="button"><span class="icon-button-content"><i data-lucide="lightbulb"></i>提示</span></button>
            <button id="play-button" type="button" class="play-action"><span class="icon-button-content"><i data-lucide="send"></i>出牌</span></button>
          </div>
          <section id="result-panel" class="result-panel" aria-live="polite" hidden>
            <span class="result-kicker">本局结束</span>
            <strong id="result-title" class="result-title">本局结束</strong>
            <span id="result-summary" class="result-summary"></span>
            <button id="rematch-button" class="rematch-action" type="button" hidden><span class="icon-button-content"><i data-lucide="rotate-ccw"></i>再来一局</span></button>
          </section>
        </section>

        <section class="hand-zone" aria-label="你的手牌">
          <div id="hand" class="hand"></div>
        </section>
      </section>
    </main>
  </body>
</html>
