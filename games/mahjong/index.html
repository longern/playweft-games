<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#083f38" />
  <link rel="icon" type="image/svg+xml" href="/mahjong.svg" />
  <meta name="description" content="Playweft 麻将：摸牌、鸣牌、立直和牌，来一场紧张刺激的日式麻将。" />
  <title>麻将 | Playweft</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071514;
    }

    html:not(.mahjong-app-ready) #mahjong-app {
      visibility: hidden;
    }

    #mahjong-boot-splash {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: grid;
      place-items: center;
      background: #071514;
      opacity: 1;
      transition: opacity 180ms ease;
    }

    .mahjong-app-ready #mahjong-boot-splash {
      pointer-events: none;
      opacity: 0;
    }

    .mahjong-boot-spinner {
      box-sizing: border-box;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(234, 195, 105, 0.2);
      border-top-color: #eac369;
      border-radius: 50%;
      animation: mahjong-boot-spin 720ms linear infinite;
    }

    .mahjong-boot-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @keyframes mahjong-boot-spin {
      to {
        transform: rotate(1turn);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #mahjong-boot-splash {
        transition: none;
      }

      .mahjong-boot-spinner {
        animation-duration: 1.8s;
      }
    }
  </style>
  <script type="module" src="./main.js"></script>
</head>

<body>
  <div id="mahjong-boot-splash" role="status" aria-live="polite">
    <span class="mahjong-boot-spinner" aria-hidden="true"></span>
    <span class="mahjong-boot-label">正在载入麻将</span>
    <noscript>麻将需要启用 JavaScript 才能运行。</noscript>
  </div>
  <main id="mahjong-app" class="mahjong-app" aria-busy="true">
    <div id="mahjong-viewport" class="mahjong-viewport">
      <nav class="table-controls" aria-label="牌桌导航">
        <button id="settings-button" class="table-control table-control-settings" type="button" aria-label="打开设置"
          aria-haspopup="dialog" aria-expanded="false">
          <i data-lucide="cog" aria-hidden="true"></i>
        </button>
      </nav>

      <nav id="auto-action-controls" class="auto-action-controls" aria-label="自动操作">
        <button id="auto-win-button" class="auto-action-control" type="button" aria-pressed="false" aria-label="自动胡牌"
          title="自动胡牌">
          <svg class="auto-action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M6 3h12v3.5a5.9 5.9 0 0 1-4.9 5.81V16h3.25a1 1 0 1 1 0 2H7.65a1 1 0 1 1 0-2H10.9v-3.69A5.9 5.9 0 0 1 6 6.5V3Zm-3 2h2v2.05A3.98 3.98 0 0 1 2 10.9V8a3 3 0 0 1 1-2.24V5Zm16 0h2v.76A3 3 0 0 1 22 8v2.9a3.98 3.98 0 0 1-3-3.85V5Z" />
          </svg>
        </button>
        <button id="pass-claims-button" class="auto-action-control" type="button" aria-pressed="false" aria-label="放弃鸣牌"
          title="放弃鸣牌">
          <svg class="auto-action-icon" data-icon="bell-off" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <mask id="pass-claims-bell-mask">
                <rect width="24" height="24" fill="white" />
                <path d="M4.8 4.8 19.2 19.2" stroke="black" stroke-width="3" stroke-linecap="round" />
              </mask>
            </defs>
            <path mask="url(#pass-claims-bell-mask)"
              d="M18 16.25v-5.5c0-3.03-1.75-5.57-4.75-6.25v-.75a1.25 1.25 0 0 0-2.5 0v.75C7.75 5.18 6 7.72 6 10.75v5.5l-2 2V20h16v-1.75l-2-2Zm-6 7.25c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2Z" />
          </svg>
        </button>
        <button id="auto-tsumogiri-button" class="auto-action-control" type="button" aria-pressed="false"
          aria-label="自动摸切" title="自动摸切">
          <svg class="auto-action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7.5" height="10" rx="1.4" />
            <path
              d="m11.25 8.4 4.5 4.5v-2.15a1 1 0 1 1 2 0v4.55a1 1 0 0 1-1 1h-4.55a1 1 0 1 1 0-2h2.15l-4.5-4.5a1 1 0 0 1 1.4-1.4Z" />
            <rect x="3" y="17" width="5" height="4" rx=".8" />
            <rect x="9.5" y="17" width="5" height="4" rx=".8" />
            <rect x="16" y="17" width="5" height="4" rx=".8" />
          </svg>
        </button>
      </nav>

      <section id="settings-dialog" class="settings-dialog" role="dialog" aria-modal="true" aria-label="牌桌设置" hidden>
        <div class="settings-dialog-card" tabindex="-1">
          <header class="settings-dialog-header">
            <div class="settings-tabs" role="tablist" aria-label="设置内容">
              <button id="settings-operation-tab" type="button" role="tab" aria-selected="true"
                aria-controls="settings-operation-panel" data-settings-tab="operation">操作</button>
              <button id="settings-theme-tab" type="button" role="tab" aria-selected="false"
                aria-controls="settings-theme-panel" data-settings-tab="theme" tabindex="-1">主题</button>
              <button id="settings-appearance-tab" type="button" role="tab" aria-selected="false"
                aria-controls="settings-appearance-panel" data-settings-tab="appearance" tabindex="-1">装扮</button>
              <button id="settings-sound-tab" type="button" role="tab" aria-selected="false"
                aria-controls="settings-sound-panel" data-settings-tab="sound" tabindex="-1">声音</button>
              <button id="settings-help-tab" type="button" role="tab" aria-selected="false"
                aria-controls="settings-help-panel" data-settings-tab="help" tabindex="-1">帮助</button>
            </div>
            <button id="settings-close-button" class="settings-dialog-close" type="button" aria-label="关闭设置">
              <i data-lucide="x" aria-hidden="true"></i>
            </button>
          </header>
          <div class="settings-dialog-body">
            <div id="settings-operation-panel" class="settings-tab-panel settings-operation-panel" role="tabpanel"
              aria-labelledby="settings-operation-tab" data-settings-panel="operation">
              <label class="settings-option" for="game-hints-setting">
                <input id="game-hints-setting" type="checkbox" />
                <strong>显示对局提示</strong>
              </label>
              <label class="settings-option" for="double-click-tsumogiri-setting">
                <input id="double-click-tsumogiri-setting" type="checkbox" />
                <strong>双击空白处摸切</strong>
              </label>
              <label class="settings-option" for="double-click-pass-setting">
                <input id="double-click-pass-setting" type="checkbox" />
                <strong>双击空白处跳过</strong>
              </label>
            </div>
            <div id="settings-sound-panel" class="settings-tab-panel settings-sound-panel" role="tabpanel"
              aria-labelledby="settings-sound-tab" data-settings-panel="sound" hidden>
              <div class="settings-volume-card">
                <div class="settings-volume-heading">
                  <label for="music-volume-setting">音乐音量</label>
                  <output id="music-volume-value" for="music-volume-setting">32%</output>
                </div>
                <input id="music-volume-setting" type="range" min="0" max="100" step="1" value="32" />
                <p id="default-bgm-copyright" class="settings-bgm-copyright" hidden></p>
              </div>
              <div class="settings-volume-card">
                <div class="settings-volume-heading">
                  <label for="discard-volume-setting">落牌音量</label>
                  <output id="discard-volume-value" for="discard-volume-setting">100%</output>
                </div>
                <input id="discard-volume-setting" type="range" min="0" max="100" step="1" value="100" />
              </div>
            </div>
            <div id="settings-theme-panel" class="settings-tab-panel settings-theme-panel" role="tabpanel"
              aria-labelledby="settings-theme-tab" data-settings-panel="theme" hidden>
              <div class="settings-theme-heading">
                <div>
                  <h2>主题包</h2>
                  <p>下载、导入和管理主题包，内容仅保存在本机。</p>
                </div>
              </div>
              <label class="settings-theme-upload" for="settings-theme-upload">
                <span>导入 ZIP 主题包</span>
                <input id="settings-theme-upload" type="file"
                  accept=".zip,application/zip,application/x-zip-compressed" />
              </label>
              <p id="settings-theme-feedback" class="settings-theme-feedback" role="status" aria-live="polite"></p>
              <ul id="settings-theme-list" class="settings-theme-list" aria-label="主题包列表"></ul>
            </div>
            <div id="settings-appearance-panel" class="settings-tab-panel settings-appearance-panel" role="tabpanel"
              aria-labelledby="settings-appearance-tab" data-settings-panel="appearance" hidden>
              <div class="settings-appearance-heading">
                <div>
                  <h2>装扮</h2>
                  <p>调整当前主题包中的具体内容。</p>
                </div>
              </div>
              <p id="settings-appearance-feedback" class="settings-appearance-feedback" role="status" aria-live="polite"></p>
              <div id="settings-appearance-controls" class="settings-appearance-controls" hidden></div>
            </div>
            <div id="settings-help-panel" class="settings-tab-panel settings-help-panel" role="tabpanel"
              aria-labelledby="settings-help-tab" data-settings-panel="help" hidden>
              <iframe id="settings-help-frame" title="麻将玩法帮助" src="./help.html"></iframe>
            </div>
          </div>
          <footer class="settings-dialog-footer">
            <button id="settings-end-match-button" class="settings-dialog-end-match" type="button" hidden>结束本局</button>
            <button id="settings-return-button" class="settings-dialog-return" type="button">返回对局</button>
          </footer>
        </div>
      </section>
      <div class="table-status-stack" aria-live="polite">
        <div class="table-status-semantic">
          <div id="dora-list" class="dora-list" aria-label="宝牌指示牌"></div>
          <div id="match-counter" class="match-counter">
            <span>本场 <b id="honba-count">0</b></span>
            <span>供托 <b id="riichi-stick-count">0</b></span>
          </div>
        </div>
        <span class="match-type-label">四人東</span>
      </div>

      <section class="table-shell" aria-label="四人麻将牌桌">
        <div class="table-rim" aria-hidden="true"></div>
        <div class="table-surface">
          <div id="mahjong-stage" class="mahjong-stage"></div>
          <section id="draw-reveal" class="draw-reveal" aria-live="assertive" hidden>
            <div class="draw-reveal-card">
              <span class="draw-reveal-tenpai draw-reveal-tenpai-top" data-draw-tenpai-seat="3" hidden></span>
              <span class="draw-reveal-tenpai draw-reveal-tenpai-right" data-draw-tenpai-seat="2" hidden></span>
              <span class="draw-reveal-tenpai draw-reveal-tenpai-bottom" data-draw-tenpai-seat="1" hidden></span>
              <span class="draw-reveal-tenpai draw-reveal-tenpai-left" data-draw-tenpai-seat="4" hidden></span>
              <strong id="draw-reveal-reason">荒牌流局</strong>
            </div>
          </section>
          <div id="hand-top" class="opponent-hand hand-top" aria-label="上家手牌"></div>
          <div id="hand-right" class="opponent-hand hand-right" aria-label="右家手牌"></div>
          <div id="hand-left" class="opponent-hand hand-left" aria-label="左家手牌"></div>

          <div id="meld-top" class="meld-area meld-top"></div>
          <div id="meld-right" class="meld-area meld-right"></div>
          <div id="meld-left" class="meld-area meld-left"></div>
          <div id="meld-bottom" class="meld-area meld-bottom"></div>

          <div id="river-top" class="discard-river river-top" aria-label="上家牌河"></div>
          <div id="river-right" class="discard-river river-right" aria-label="右家牌河"></div>
          <div id="river-left" class="discard-river river-left" aria-label="左家牌河"></div>
          <div id="river-bottom" class="discard-river river-bottom" aria-label="你的牌河"></div>

          <article id="player-top" class="player-station player-top">
            <div class="player-avatar is-default-portrait" data-player-avatar aria-hidden="true"></div>
            <span class="wind-badge" data-wind>西</span>
            <span><strong data-name>织羽</strong></span>
          </article>
          <article id="player-right" class="player-station player-right">
            <div class="player-avatar is-default-portrait" data-player-avatar aria-hidden="true"></div>
            <span class="wind-badge" data-wind>南</span>
            <span><strong data-name>青岚</strong></span>
          </article>
          <article id="player-left" class="player-station player-left">
            <div class="player-avatar is-default-portrait" data-player-avatar aria-hidden="true"></div>
            <span class="wind-badge" data-wind>北</span>
            <span><strong data-name>墨池</strong></span>
          </article>
          <article id="player-bottom" class="player-station player-bottom">
            <div class="player-avatar is-default-portrait" data-player-avatar aria-hidden="true"></div>
            <span class="wind-badge" data-wind>東</span>
            <span><strong data-name>你</strong></span>
          </article>

          <section class="table-console" aria-live="polite">
            <span class="console-score score-top" data-console-score="2">25000</span>
            <span class="console-score score-right" data-console-score="1">25000</span>
            <span class="console-score score-bottom" data-console-score="0">25000</span>
            <span class="console-score score-left" data-console-score="3">25000</span>
            <div class="console-core">
              <strong id="console-round">东一局</strong>
              <b id="wall-count">余牌 69</b>
            </div>
            <div class="console-status">
              <strong id="turn-heading">正在载入规则</strong>
              <span id="table-message">正在准备牌桌…</span>
            </div>
          </section>

        </div>
      </section>

      <section class="player-dock" aria-label="你的手牌与操作">
        <aside id="tenpai-preview" class="tenpai-preview" aria-label="打出后听牌" aria-live="polite" hidden>
          <div id="tenpai-waits" class="tenpai-wait-list"></div>
        </aside>
        <div id="action-bar" class="action-bar" aria-live="polite">
          <span id="action-hint">等待其他玩家</span>
          <div id="claim-actions" class="claim-actions"></div>
          <button id="pass-button" class="secondary-action" type="button" hidden>跳过</button>
          <button id="abort-button" class="secondary-action" type="button" hidden>流局</button>
          <button id="riichi-button" class="gold-action" type="button" hidden>立直</button>
          <button id="cancel-riichi-button" class="riichi-cancel-action" type="button" aria-label="取消立直" title="取消立直"
            hidden><i data-lucide="x" aria-hidden="true"></i></button>
          <button id="tsumo-button" class="win-action" type="button" hidden>自摸</button>
          <span id="furiten-badge" class="furiten-badge" hidden>振听</span>
        </div>
        <div id="hand-bottom" class="own-hand" role="listbox" aria-label="你的手牌"></div>
      </section>

      <section id="result-panel" class="result-panel" aria-live="assertive" hidden>
        <div class="result-page-stage">
          <div class="result-page-track">
            <div id="result-detail-content" class="result-content result-detail-content">
              <div id="result-hands" class="result-hands" aria-label="胡牌牌型"></div>
              <div id="result-yaku" class="result-yaku"></div>
            </div>
            <div id="result-score-content" class="result-content result-score-content" aria-label="记分纸" hidden></div>
            <div class="result-footer">
              <button id="rematch-button" class="result-start-control" type="button" aria-label="继续">
                <span class="result-start-control-cap" aria-hidden="true"></span>
                <span id="rematch-button-label" class="result-start-control-label">继续</span>
              </button>
            </div>
          </div>
        </div>
        <section id="match-summary" class="match-summary" aria-label="最终排名" hidden>
          <div class="match-summary-layout">
            <div class="match-summary-photo" aria-hidden="true">
              <div id="match-summary-photo-crop" class="match-summary-photo-crop">
                <img id="match-summary-photo-image" alt="" hidden />
              </div>
            </div>
            <table class="match-summary-table" aria-label="最终分数">
              <tbody id="match-summary-rows"></tbody>
            </table>
            <div class="match-summary-actions">
              <button id="match-summary-rematch" type="button">再来一局</button>
              <button id="match-summary-setup" type="button">返回大厅</button>
            </div>
          </div>
        </section>
      </section>

      <section id="setup-panel" class="setup-panel" aria-label="选择对局长度">
        <div class="setup-scene">
          <div id="setup-signpost-stage" class="setup-signpost" aria-label="选择东风场或南风场">
            <img class="setup-signpost-image" data-deferred-image="signpost" alt="" aria-hidden="true" />
            <button class="setup-route-sign setup-route-east" type="button" data-match-type="east"
              aria-label="东风场，东一局至东四局"><span>東風場</span></button>
            <button class="setup-route-sign setup-route-south" type="button" data-match-type="hanchan"
              aria-label="南风场，包含东场与南场"><span>南風場</span></button>
          </div>
          <details class="rule-options">
            <summary>高级规则</summary>
            <label><input type="checkbox" data-rule="multipleRon" checked /> 一炮多响</label>
            <label><input type="checkbox" data-rule="tripleRonAbort" /> 三家和流局</label>
            <label><input type="checkbox" data-rule="abortiveDraws" checked /> 途中流局</label>
            <label><input type="checkbox" data-rule="nagashiMangan" checked /> 流局满贯</label>
            <label><input type="checkbox" data-rule="pao" checked /> 包牌</label>
            <label><input type="checkbox" data-rule="bankruptcy" checked /> 击飞结束</label>
            <label><input type="checkbox" data-rule="extensions" checked /> 南入／西入</label>
            <label><input type="checkbox" data-rule="agariYame" checked /> 终局庄家止和</label>
          </details>
          <p id="setup-recovery-error" class="setup-recovery-error" role="status" aria-live="polite" hidden></p>
        </div>
      </section>

      <section id="loading-panel" class="loading-panel" role="status" aria-label="正在洗牌并码好牌山" hidden>
        <div class="loading-card" aria-hidden="true">
          <span class="loading-spinner"></span>
        </div>
        <p id="loading-message" hidden></p>
      </section>
    </div>
  </main>
</body>

</html>
